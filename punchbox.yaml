boxen:
  30note:
    # Confirmed against a real 30-note music box paper-strip template (low -> high).
    note_data: [60, 62, 67, 69, 71, 72, 74, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 86, 87, 88, 89, 90, 91, 92, 93, 94, 95, 96, 98, 100]
    pitch: 2.0
    reverse: True
    note_collision: 5.0
    # Unmeasured placeholder (mm/s the physical strip feeds through the box) -
    # time this on the real box and correct it; the GUI's playback-speed slider
    # is a stopgap until then.
    feed_rate_mm_per_s: 15.0
# mm of strip per quarter-length beat. Was MIDI-ticks-per-mm before the source model
# switched to quarter-lengths - this value needs a fresh visual re-tune, not reuse.
divisor: 49.5 #67.0
#filename: FF7AC-TifasTheme_short2.mid
filename: mooshoo.mid
transpose:
    lower: -100
    upper: 100
# Real physical strip is 90mm wide x ~700mm long (one continuous run, not A4
# sheets to cut & tape) - width/height here are draw_layout's internal (time
# budget, lane budget) axes, which print/SVG output then rotates 90 degrees
# via RotatedRenderer to match the strip's actual narrow-and-long shape. See
# punchbox_gui/print_export/print_controller.py.
page:
    width: 700.0
    height: 90.0
margin: 10.0
output: mooshoo
font_size: 1.0
marker_offset: 4
marker_size: 3
default_musicbox: 30note
